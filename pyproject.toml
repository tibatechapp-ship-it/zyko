[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyko"
version = "0.44.0"
description = "ZYKO — the deterministic Arabic coding engine (generate, review, fix in one command) on a verifiable AI-orchestration platform. Runs on Linux, Windows, macOS, Android and Termux."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ZYKO Contributors" }]
keywords = [
    "ai", "llm", "orchestration", "router", "agents", "mcp", "coding-engine",
    "code-review", "auto-fix", "arabic",
    "policy-as-code", "multi-provider", "termux", "android",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.25",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["rich>=13.0"]
# pydantic-core has no wheel for Python 3.14 on Termux/Android yet — the same
# gate as the dev extra below. `zyko[structured]` must install (sans pydantic,
# which the engine already treats as optional) on the platform ZYKO
# advertises first-class.
structured = ["pydantic>=2.0; python_version < '3.14'"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    # pydantic-core has no wheel for Python 3.14 on Termux/Android yet; the
    # suite skips those tests via pytest.importorskip, so `.[dev]` must not
    # demand a Rust toolchain on the platform ZYKO advertises first-class.
    "pydantic>=2.0; python_version < '3.14'",
]
android = ["kivy>=2.3"]

[project.scripts]
zyko = "zyko.cli:main"

[project.urls]
Homepage = "https://github.com/tibatechapp-ship-it/zyko"
Repository = "https://github.com/tibatechapp-ship-it/zyko"
Documentation = "https://tibatechapp-ship-it.github.io/zyko/"
Issues = "https://github.com/tibatechapp-ship-it/zyko/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zyko = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# Pin the async-fixture loop scope: without this, pytest-asyncio emits a
# PytestDeprecationWarning on EVERY run (CI matrix, Termux, local), training
# developers to ignore warnings. "function" is the documented default and
# what the suite was implicitly using.
asyncio_default_fixture_loop_scope = "function"
# A deprecation warning from pytest itself is a future breakage of this
# suite — fail loudly now instead of silently rotting.
filterwarnings = ["error::pytest.PytestDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# samples/ هي عيّنات معطوبة بقصد — غذاء المصلاح والمراجع، لا كود إنتاج.
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

# bandit configuration lives in .bandit.yml
# (bandit <=1.9.x does not read pyproject.toml)
