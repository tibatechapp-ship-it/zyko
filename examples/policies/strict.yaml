# ZYKO strict policy — production posture: capped spend, PII hygiene,
# no dangerous tools, restricted model surface.
version: 1
name: strict

defaults:
  budget_usd_per_day: 2.0
  max_tokens_per_request: 2048

models:
  allow:
    - "openai/gpt-4o-mini"
    - "openai/gpt-4.1-mini"
    - "anthropic/claude-3-5-haiku*"
    - "google/gemini-2.5-flash"
    - "ollama/*"
  deny:
    - "*opus*"

providers:
  allow: ["openai", "anthropic", "google", "ollama"]

tools:
  allow: ["calculator", "read_file", "write_file", "list_dir"]
  deny: ["shell*"]

privacy:
  redact: [email, phone, credit_card, iban, ssn]

rate_limit:
  requests_per_minute: 30

audit:
  enabled: true
