name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # fastapi+httpx: بوابة المرحلة 1 تمارن اختبارات القالب الحقيقي لا skip
        run: pip install -e .[dev] fastapi httpx
      - name: Test
        run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks

  security:
    name: security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis (SAST)
        run: bandit -r src/zyko -q -c .bandit.yml
      - name: Dependency audit (declared deps only)
        run: |
          pip install -e .
          pip-audit --skip-editable

  rust-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the optional PyO3 accelerator compiles
        working-directory: rust/zyko-kernel
        run: cargo check

  phase0-tools:
    name: phase-0 Arabic tools (coverage ≥85% + RTL gate + typography)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Deterministic tools coverage gate (≥85%)
        run: >
          pytest tests/test_tools_pii_ar.py tests/test_tools_rtl.py
          tests/test_tools_policy_mcp.py --cov=zyko.tools
          --cov-report=term --cov-fail-under=85 -q
      - name: Phase-0 gate — Arabic PII sample 20/20
        run: |
          # scan exits 1 by design when findings exist (linter convention) —
          # the gate asserts on the JSON payload, not the exit code.
          python -m zyko.tools.pii_ar scan --file samples/arabic_mix.txt --format json > /tmp/gate.json || true
          python -c "import json; d=json.load(open('/tmp/gate.json')); assert d['count'] == 20, f'{d[\"count\"]}/20'; print('gate 20/20 OK')"
      - name: Phase-0 gate — pii_ar policy validates and redacts
        run: |
          python -m zyko policy check examples/policies/pii_ar.yaml
          python -m zyko policy redact "اسمي محمد أحمد ورقمي 0501234567" examples/policies/pii_ar.yaml | grep -v "محمد أحمد"
      - name: RTL self-gate on ZYKO source (fail on warning+)
        run: python -m zyko.tools.rtl check --path src --fail-on warning
      - name: Arabic typography scan
        run: python scripts/check_arabic_typography.py src

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: CLI surfaces work without any API key
        run: |
          zyko --version
          zyko info
          zyko doctor
          zyko route "planning only"
          zyko policy redact "mail bob@corp.com"
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","clientInfo":{}}}' | zyko mcp serve

  phase1-coder:
    name: phase-1 coder (deterministic generation gate — 10 Arabic descriptions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (coder tests exercise the real fastapi template)
        run: pip install -e .[dev] pytest-cov fastapi httpx
      - name: Coder coverage gate (≥85%)
        run: >
          pytest tests/test_coder_plan.py tests/test_coder_templates.py
          tests/test_coder_generate_precheck.py tests/test_coder_gate.py
          tests/test_coder_cli.py tests/test_coder_crew_prompts.py
          --cov=zyko.coder --cov-report=term --cov-fail-under=85 -q
      - name: Phase-1 acceptance gate — 10/10 generate, ≥8/10 first-run tests
        run: python -m zyko.coder gate
      - name: zyko new — plan preview writes nothing, then approved build works
        run: |
          zyko new --plan "قائمة مهام بسيطة للفريق" --json > /tmp/plan.json
          python -c "import json; d=json.load(open('/tmp/plan.json')); assert d['template'], d"
          cd /tmp && zyko new --plan "قائمة مهام بسيطة للفريق" --yes --no-git --run-tests
          test -f /tmp/todo-cli/RECEIPT.md && echo "receipt OK"

  phase2-reviewer:
    name: phase-2 reviewer (27 Arabic rules — recall/precision/determinism gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Reviewer coverage gate (≥85%)
        run: >
          pytest tests/test_reviewer_rules.py tests/test_reviewer_engine.py
          tests/test_reviewer_report_cli.py tests/test_reviewer_robustness.py
          tests/test_reviewer_gate.py tests/test_reviewer_mcp.py
          --cov=zyko.reviewer --cov-report=term --cov-fail-under=85 -q
      - name: Phase-2 gate — 29/29 planted defects, clean stays clean, byte determinism
        run: python -m zyko.reviewer gate
      - name: Reviewer CLI — defective fails, clean passes (exit-code contract)
        run: |
          python -m zyko.reviewer review --path samples/review/bad_security.py --format json > /tmp/rev.json || true
          python -c "import json; d=json.load(open('/tmp/rev.json')); assert d['score'] < 60 and d['counts']['critical'] >= 2, d; print('defective verdict OK')"
          python -m zyko.reviewer review --path samples/review/clean_good.py --fail-under 95
          python -m zyko.reviewer review --path samples/review/clean_error_handling.py --fail-under 95

  phase3-fixer:
    name: phase-3 fixer (12 safe repair paths — fix/idempotence/determinism gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Fixer coverage gate (≥85%)
        run: >
          pytest tests/test_fixer_edits.py tests/test_fixer_fixes.py
          tests/test_fixer_engine.py tests/test_fixer_report_cli.py
          tests/test_fixer_gate.py tests/test_fixer_mcp.py
          tests/test_fixer_robustness.py
          --cov=zyko.fixer --cov-report=term --cov-fail-under=85 -q
      - name: Phase-3 gate — expected fixes resolved, idempotent, byte-deterministic
        run: python -m zyko.fixer gate
      - name: Fixer CLI — dry-run, write, then clean check (exit-code contract)
        run: |
          cp samples/fix/bad_quality.py /tmp/qlt.py
          python -m zyko.fixer fix --path /tmp/qlt.py --format summary
          python -m zyko.fixer check --path /tmp/qlt.py > /dev/null 2>&1 && echo "UNEXPECTED clean" || echo "check=1 as expected"
          python -m zyko.fixer fix --path /tmp/qlt.py --write 2>/dev/null
          python -m zyko.fixer check --path /tmp/qlt.py
          python -m zyko.fixer check --path samples/review/clean_good.py
          python -c "import ast; ast.parse(open('/tmp/qlt.py', encoding='utf-8').read()); print('written file parses OK')"

  phase4-pipeline:
    name: phase-4 pipeline (feedback loop — determinism/idempotence/robustness gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Pipeline coverage gate (≥85%)
        run: >
          pytest tests/test_pipeline_engine.py tests/test_pipeline_report_cli.py
          tests/test_pipeline_robustness.py tests/test_pipeline_gate.py
          tests/test_pipeline_mcp.py
          --cov=zyko.pipeline --cov-report=term --cov-fail-under=85 -q
      - name: Phase-4 gate — 4 anchors × 6 gates (complete/deterministic/idempotent/improved/robust/fast)
        run: python -m zyko.pipeline gate
      - name: Pipeline CLI — one command in, fixed project out (exit-code contract)
        run: |
          rm -rf /tmp/p4-ci && mkdir -p /tmp/p4-ci
          python -m zyko.pipeline run --description "قائمة مهام للفريق مع تقارير" --out /tmp/p4-ci/todo --fail-under 60 > /dev/null 2>&1; echo "run exit=$? (0/1 expected)"
          python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('/tmp/p4-ci/todo').rglob('*.py')]; print('fixed tree parses OK')"
          python -m zyko.pipeline run --description "قائمة مهام للفريق" --out /tmp/p4-ci/dry --dry-run --fail-under 60 --format json > /tmp/p4-ci/report.json
          python -c "
          import json
          d = json.load(open('/tmp/p4-ci/report.json', encoding='utf-8'))
          assert d['schema'] == 'zyko.pipeline/1' and d['ok'] and d['fixed_total'] >= 0
          assert all(o['suggestion_ar'] for f in d['per_file'] for o in f['outcomes'])
          print('pipeline JSON payload OK — every outcome carries suggestion_ar')
          "
          test ! -e /tmp/p4-ci/dry && echo "dry-run wrote nothing OK"

  phase5-workspace:
    name: phase-5 workspace (existing projects — determinism/idempotence/robustness gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Workspace coverage gate (≥85%)
        run: >
          pytest tests/test_workspace_engine.py tests/test_workspace_report_cli.py
          tests/test_workspace_robustness.py tests/test_workspace_gate.py
          tests/test_workspace_mcp.py
          --cov=zyko.workspace --cov-report=term --cov-fail-under=85 -q
      - name: Phase-5 gate — 3 anchors × 6 gates (complete/deterministic/idempotent/improved/robust/fast)
        run: python -m zyko.workspace gate
      - name: Workspace CLI — dry by default, consent-gated writes (exit-code contract)
        run: |
          rm -rf /tmp/p5-ci && mkdir -p /tmp/p5-ci
          cp -r samples/workspace/small_tool /tmp/p5-ci/proj
          python -m zyko.workspace run --src /tmp/p5-ci/proj --fail-under 60 --format json > /tmp/p5-ci/dry.json
          python -c "
          import json
          d = json.load(open('/tmp/p5-ci/dry.json', encoding='utf-8'))
          assert d['schema'] == 'zyko.workspace/1' and d['ok'] and d['fixed_total'] > 0
          assert d['written'] == [], 'dry run must write nothing'
          assert all(o['suggestion_ar'] for f in d['per_file'] for o in f['outcomes'])
          print('workspace dry JSON OK — every outcome carries suggestion_ar')
          "
          python -m zyko.workspace run --src /tmp/p5-ci/proj --out /tmp/p5-ci/fixed --fail-under 60 > /dev/null
          python -c "import ast,pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('/tmp/p5-ci/fixed').rglob('*.py')]; print('fixed copy parses OK')"
          if python -m zyko.workspace run --src /tmp/p5-ci/proj --in-place 2>/tmp/p5-ci/err.txt; then
            echo "ERROR: in-place without --yes must fail"; exit 1
          fi
          grep -q -- "--yes" /tmp/p5-ci/err.txt && echo "in-place without --yes refused OK"
  phase6-baseline:
    name: phase-6 baseline (quality guard — determinism/regression-detection/robustness gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev] pytest-cov
      - name: Baseline coverage gate (≥85%)
        run: >
          pytest tests/test_baseline_engine.py tests/test_baseline_report_cli.py
          tests/test_baseline_robustness.py tests/test_baseline_gate.py
          tests/test_baseline_mcp.py
          --cov=zyko.baseline --cov-report=term --cov-fail-under=85 -q
      - name: Phase-6 gate — 3 anchors × 6 gates (complete/deterministic/detects-regression/detects-improvement/robust/fast)
        run: python -m zyko.baseline gate
      - name: Baseline CLI — update/check cycle with regression detection and HTML report
        run: |
          rm -rf /tmp/p6-ci && mkdir -p /tmp/p6-ci
          cp -r samples/workspace/small_tool /tmp/p6-ci/proj
          python -m zyko.baseline update --src /tmp/p6-ci/proj --format json > /tmp/p6-ci/upd.json
          python -c "
          import json
          d = json.load(open('/tmp/p6-ci/upd.json', encoding='utf-8'))
          assert d['schema'] == 'zyko.baseline/1' and d['ok'] and d['created'] and d['run_no'] == 1
          print('baseline created OK — one file, run_no=1')
          "
          python -m zyko.baseline check --src /tmp/p6-ci/proj > /dev/null && echo "clean check exit 0 OK"
          python -m zyko.baseline check --src /tmp/p6-ci/proj --html /tmp/p6-ci/report.html > /dev/null
          python -c "
          h = open('/tmp/p6-ci/report.html', encoding='utf-8').read()
          assert 'dir=\"rtl\"' in h and '<script' not in h
          print('HTML report OK — RTL, scriptless')
          "
          echo '

          def _ci_probe(x):
              return eval(x)
          ' >> /tmp/p6-ci/proj/tool.py
          if python -m zyko.baseline check --src /tmp/p6-ci/proj; then
            echo "ERROR: regression must exit 1"; exit 1
          fi
          echo "regression detection exit 1 OK"
          python -m zyko.baseline check --src /tmp/p6-ci/proj --format json > /tmp/p6-ci/reg.json || true
          python -c "
          import json
          d = json.load(open('/tmp/p6-ci/reg.json', encoding='utf-8'))
          assert d['regressed_files'] >= 1 and d['new_findings_total'] >= 1
          assert any(f['path'] == 'tool.py' and f['status'] == 'regressed' for f in d['per_file'])
          print('regression payload OK — file named, findings counted')
          "
